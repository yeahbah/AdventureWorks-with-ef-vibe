# Showcase: efvibe LINQ scan in CI — deep scan with SQL translation, EXPLAIN, and severity gate.
# https://github.com/yeahbah/my-ef-vibe
name: efvibe LINQ scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efvibe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SA_PASSWORD: AdventureWorks_CI_2022!
  EF_PROJECT: apps/api-dotnet/src/AdventureWorks.Infrastructure.Persistence/AdventureWorks.Infrastructure.Persistence.csproj
  STARTUP_PROJECT: apps/api-dotnet/src/AdventureWorks.API/AdventureWorks.API.csproj
  DB_CONTEXT: AdventureWorksDbContext
  CI_CONNECTION: >-
    Server=localhost,1433;Database=AdventureWorks;User Id=sa;Password=AdventureWorks_CI_2022!;
    Encrypt=false;TrustServerCertificate=true

jobs:
  scan-deep:
    name: efvibe scan deep — gate on critical
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create AdventureWorks database
        run: |
          docker run --rm --network host mcr.microsoft.com/mssql-tools18 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q \
            "IF DB_ID('AdventureWorks') IS NULL CREATE DATABASE AdventureWorks;"

      - name: Apply DbUp migrations (optional schema for EXPLAIN)
        working-directory: database/dbup/AdventureWorks.DbUp
        env:
          ASPNETCORE_ENVIRONMENT: CI
          ConnectionStrings__AdventureWorks: ${{ env.CI_CONNECTION }}
        continue-on-error: true
        run: dotnet run --configuration Release

      - name: Install efvibe
        run: dotnet tool restore

      - name: scan deep — stop on critical (--fail-on critical)
        run: >
          dotnet tool run efvibe --
          scan deep
          -w "${{ github.workspace }}/.efvibe-ci"
          -p "${{ env.EF_PROJECT }}"
          -s "${{ env.STARTUP_PROJECT }}"
          -c "${{ env.DB_CONTEXT }}"
          -f net10.0
          --provider sqlserver
          --connection-string "${{ env.CI_CONNECTION }}"
          --fail-on critical
          --json | tee efvibe-scan-deep.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efvibe-scan-deep
          path: |
            efvibe-scan-deep.json
            .efvibe-ci/**/myefvibe-scan-deep.json
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: bash .github/scripts/efvibe-job-summary.sh efvibe-scan-deep.json "efvibe scan deep"
